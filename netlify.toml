  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Talentpact/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CONVERSACION_FINAL_PARA_SEGUIR.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/serve-demo.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
