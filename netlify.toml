[build]
  functions = "netlify/functions"

# Funciones: API moderno (netlify/functions/*.mjs → lib/handlers/*.js).
# Las dependencias pesadas (ethers, stripe) las importa la entrada .mjs que las
# usa: así el empaquetador de Netlify (nft) las incluye en el zip.

# ─── Capas de protección en el navegador ─────────────────────────────────────
# serve-demo.js lee este mismo bloque, así que la demo local se comporta igual
# que producción: si la CSP rompe algo, se ve antes de desplegar.
#
# · CSP: la web solo habla con su propio origen, Supabase, jsDelivr (cliente de
#   Supabase), Google Fonts y Google Analytics (solo si se acepta). 'unsafe-inline'
#   sigue siendo necesario mientras el HTML use manejadores onclick en línea;
#   quitarlo es el siguiente paso (ver el documento de mejoras).
# · frame-ancestors 'none': nadie puede incrustar TalentPact en un iframe para
#   robar clics (clickjacking) sobre "Desbloquear contacto".
# · Permissions-Policy: cámara y micrófono solo para nuestro origen (pruebas
#   supervisadas y retos de voz); el resto de sensores, apagados.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# ─── SkillPass verificable sin TalentPact ────────────────────────────────────
# did:web:talentpact.es se resuelve en /.well-known/did.json (clave pública con
# la que se firman los SkillPass) y la lista de revocación vive en /status/1.
[[redirects]]
  from = "/.well-known/did.json"
  to = "/.netlify/functions/did-web"
  status = 200

[[redirects]]
  from = "/status/1"
  to = "/.netlify/functions/status-list"
  status = 200

# ─── Lo que nunca se sirve como web ──────────────────────────────────────────
# Sin carpeta de publicación propia, Netlify publica el repositorio entero: el
# catálogo con las soluciones de los retos (netlify/functions/lib), las
# herramientas y los tests (también con soluciones), los SQL y la bóveda de
# trabajo se podían descargar desde el navegador. serve-demo.js bloquea lo mismo.

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
